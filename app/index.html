<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Scenes</title>
<meta name="description" content="Chia truyện audio YouTube dài thành các cảnh có tiêu đề, từ khóa, tìm kiếm được.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a href="#" class="brand" id="home">🎬 YT Scenes</a>
  <span class="grow"></span>
  <button id="btn-settings" title="Cài đặt">⚙️ Cài đặt</button>
</header>

<main id="view"></main>

<dialog id="settings">
  <form method="dialog" class="stack">
    <h2>Cài đặt</h2>
    <label>AI
      <select name="preset">
        <option value="gemini-free">Google Gemini — key miễn phí (mặc định)</option>
        <option value="claude-haiku">Claude Haiku — trả phí, rất rẻ</option>
        <option value="custom">Khác (API kiểu OpenAI)</option>
      </select>
    </label>
    <label>API key <input name="apiKey" type="password" autocomplete="off" placeholder="dán key vào đây (lấy miễn phí ở aistudio.google.com)"></label>
    <label>Model <input name="model" list="models" autocomplete="off"></label>
    <datalist id="models"></datalist>
    <div class="row"><button type="button" id="btn-check">Kiểm tra key</button><span id="check-out" class="muted"></span></div>
    <p class="note">Gói miễn phí của Gemini: Google có thể dùng nội dung gửi lên để cải thiện sản phẩm. Đừng dùng cho tài liệu riêng tư.</p>
    <label>Bảng tên nghe nhầm (mỗi dòng: <code>sai, sai = đúng</code>)
      <textarea name="glossary" rows="4" placeholder="Đen Di, đen đi = Denji&#10;ma ki ma = Makima"></textarea>
    </label>
    <details><summary>Nâng cao</summary>
      <div class="stack">
        <label>Kiểu API
          <select name="provider"><option value="gemini">Gemini</option><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI-compatible</option></select>
        </label>
        <label>Địa chỉ API <input name="baseUrl"></label>
        <label>Số lượt gọi tối đa mỗi phút <input name="rpm" type="number" min="1"></label>
        <label class="row"><input name="free" type="checkbox" style="width:auto"> Gói miễn phí (chi phí hiển thị $0)</label>
        <label>Giá input $/1M token <input name="priceIn" type="number" step="0.01"></label>
        <label>Giá output $/1M token <input name="priceOut" type="number" step="0.01"></label>
      </div>
    </details>
    <p class="muted">Key và bảng tên chỉ lưu trong trình duyệt này (localStorage), key gửi thẳng tới nhà cung cấp AI, không qua máy chủ nào khác.</p>
    <div class="row"><button value="cancel">Hủy</button><span class="grow"></span><button value="save" class="primary">Lưu</button></div>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
